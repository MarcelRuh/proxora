name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://proxora:proxora@localhost:5432/proxora?schema=public
      ENCRYPTION_KEY: ci-encryption-key-must-be-32-chars!!
      SESSION_SECRET: ci-session-secret-must-be-32-chars!!
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/proxora-release.jks
            echo "PROXORA_KEYSTORE_FILE=${GITHUB_WORKSPACE}/android/proxora-release.jks" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "Tagged releases require ANDROID_KEYSTORE_BASE64" >&2
            exit 1
          fi
      - run: gradle :app:assembleRelease --stacktrace
        working-directory: android
        env:
          PROXORA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PROXORA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PROXORA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: proxora-android
          path: android/app/build/outputs/apk/release/*.apk
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          cp android/app/build/outputs/apk/release/app-release.apk "proxora-${ver}.apk"
          gh release upload "$GITHUB_REF_NAME" "proxora-${ver}.apk" --clobber

  docker:
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: proxora:ci
