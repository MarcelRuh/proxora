services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: proxora
      POSTGRES_PASSWORD: proxora
      POSTGRES_DB: proxora
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proxora -d proxora"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  proxora:
    build: .
    container_name: proxora
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://proxora:proxora@postgres:5432/proxora?schema=public
      REDIS_URL: redis://redis:6379
      APP_URL: http://localhost:3000
      PORT: "3000"
      LISTEN_HOST: "0.0.0.0"
      PROXORA_INSTALL_DIR: ${PROXORA_INSTALL_DIR:-/opt/proxora}
      PROXORA_INSTALL_MOUNT: /install
      PROXORA_REPO: ${PROXORA_REPO:-MarcelRuh/proxora}
      PROXORA_BRANCH: ${PROXORA_BRANCH:-main}
      PROXORA_UPDATE_SIGNAL_DIR: /update-signal
    volumes:
      - ${PROXORA_INSTALL_DIR:-.}:/install:ro
      - proxora_update_signal:/update-signal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # Owns docker.sock. The app only writes /update-signal/request.
  proxora-updater:
    image: docker:27-cli
    container_name: proxora-updater
    restart: unless-stopped
    environment:
      PROXORA_INSTALL_DIR: ${PROXORA_INSTALL_DIR:-/opt/proxora}
      PROXORA_REPO: ${PROXORA_REPO:-MarcelRuh/proxora}
      PROXORA_BRANCH: ${PROXORA_BRANCH:-main}
      PROXORA_UPDATE_SIGNAL_DIR: /update-signal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PROXORA_INSTALL_DIR:-/opt/proxora}:${PROXORA_INSTALL_DIR:-/opt/proxora}
      - ${PROXORA_INSTALL_DIR:-/opt/proxora}/scripts/update-watcher.sh:/update-watcher.sh:ro
      - proxora_update_signal:/update-signal
    entrypoint: ["sh", "/update-watcher.sh"]
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  proxora_update_signal:
