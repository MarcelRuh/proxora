name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://proxora:proxora@localhost:5432/proxora?schema=public
      ENCRYPTION_KEY: ci-encryption-key-must-be-32-chars!!
      SESSION_SECRET: ci-session-secret-must-be-32-chars!!
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n scripts/install.sh scripts/update.sh scripts/self-update-apply.sh scripts/update-watcher.sh scripts/docker-pull-progress.sh scripts/desktop-updater-smoke.sh scripts/postgres-backup-smoke.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses
        run: |
          sdkmanager="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
          if [ -n "$sdkmanager" ]; then
            yes | "$sdkmanager" --licenses >/dev/null || true
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Decode release keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/proxora-release.jks
            echo "PROXORA_KEYSTORE_FILE=${GITHUB_WORKSPACE}/android/proxora-release.jks" >> "$GITHUB_ENV"
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "Tagged releases require ANDROID_KEYSTORE_BASE64" >&2
            exit 1
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - run: gradle :app:assembleRelease --stacktrace
        working-directory: android
        env:
          PROXORA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PROXORA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PROXORA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: proxora-android
          path: android/app/build/outputs/apk/release/*.apk
      - name: Upload APK to GitHub release
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v') && steps.keystore.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          tag="v${ver}"
          python3 scripts/release-notes.py "$ver" > /tmp/proxora-release-notes.md
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "$tag" --notes-file /tmp/proxora-release-notes.md
          fi
          cp android/app/build/outputs/apk/release/app-release.apk "proxora-${ver}.apk"
          gh release upload "$tag" "proxora-${ver}.apk" --clobber

  desktop-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install WebKitGTK deps
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev
      - name: Disable updater artifacts off tags
        if: ${{ github.event_name == 'pull_request' || !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: desktop
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("src-tauri/tauri.conf.json")
          conf = json.loads(path.read_text())
          conf["bundle"]["createUpdaterArtifacts"] = False
          path.write_text(json.dumps(conf, indent=2) + "\n")
          PY
      - name: Build desktop client
        working-directory: desktop
        env:
          NODE_ENV: development
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: proxora-desktop-linux
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/appimage/*.sig
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
      - name: Upload desktop packages to GitHub release
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          tag="v${ver}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            python3 scripts/release-notes.py "$ver" > /tmp/proxora-release-notes.md
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "$tag" --notes-file /tmp/proxora-release-notes.md
          fi
          shopt -s nullglob
          files=(
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/appimage/*.sig
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
          )
          gh release upload "$tag" "${files[@]}" --clobber

  desktop-windows:
    runs-on: windows-latest
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Build desktop client
        working-directory: desktop
        shell: bash
        env:
          NODE_ENV: development
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: proxora-desktop-windows
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/msi/*.sig
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.sig
      - name: Upload Windows packages to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUTF8: "1"
        run: |
          ver="$(python3 -c 'import json; print(json.load(open("package.json", encoding="utf-8"))["version"])')"
          tag="v${ver}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            python3 scripts/release-notes.py "$ver" > /tmp/proxora-release-notes.md
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "$tag" --notes-file /tmp/proxora-release-notes.md
          fi
          shopt -s nullglob
          files=(
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/msi/*.sig
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.sig
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Windows bundles found" >&2
            exit 1
          fi
          gh release upload "$tag" "${files[@]}" --clobber

  desktop-updater-manifest:
    runs-on: ubuntu-latest
    needs: [desktop-linux, desktop-windows]
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish latest.json for Tauri updater
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          tag="v${ver}"
          # Wait briefly for asset uploads to settle across jobs.
          for i in 1 2 3 4 5 6; do
            names="$(gh release view "$tag" --json assets --jq '[.assets[].name] | join("\n")')"
            echo "$names" | grep -q "Proxora_${ver}_amd64.AppImage.sig" || { sleep 10; continue; }
            echo "$names" | grep -q "Proxora_${ver}_x64-setup.exe.sig" || { sleep 10; continue; }
            break
          done
          python3 scripts/desktop-latest-json.py "$tag" --out /tmp/latest.json
          gh release upload "$tag" /tmp/latest.json --clobber
      - name: Desktop updater smoke
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          bash scripts/desktop-updater-smoke.sh "v${ver}"

  docker:
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=ci" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ghcr.io/marcelruh/proxora:${{ steps.ver.outputs.tag }}
      - name: Make image public
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT -H "Accept: application/vnd.github+json" \
            "/user/packages/container/proxora/visibility" -f visibility=public || true
      - name: Verify GHCR tag is pullable
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver="${{ steps.ver.outputs.tag }}"
          docker pull "ghcr.io/marcelruh/proxora:${ver}"

  release-publish:
    runs-on: ubuntu-latest
    needs: [docker, android, desktop-updater-manifest]
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish GitHub release only after GHCR image exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          tag="v${ver}"
          # Confirm the container tag is live (anonymous GHCR token).
          token="$(curl -fsS "https://ghcr.io/token?service=ghcr.io&scope=repository:marcelruh/proxora:pull" | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])')"
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/marcelruh/proxora/manifests/${ver}")"
          if [[ "$code" != "200" ]]; then
            echo "GHCR manifest for ${ver} returned HTTP ${code}" >&2
            exit 1
          fi
          # Assets were uploaded to a draft; publish now so /releases/latest and self-update see it.
          if gh release view "$tag" --json isDraft --jq .isDraft | grep -q true; then
            gh release edit "$tag" --draft=false
            echo "Published ${tag}"
          else
            echo "${tag} already published"
          fi
          bash scripts/desktop-updater-smoke.sh "$tag"
