services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: proxora
      POSTGRES_PASSWORD: proxora
      POSTGRES_DB: proxora
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proxora -d proxora"]
      interval: 5s
      timeout: 5s
      retries: 10

  proxora:
    build: .
    container_name: proxora
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://proxora:proxora@postgres:5432/proxora?schema=public
      APP_URL: http://localhost:3000
      PORT: "3000"
      LISTEN_HOST: "0.0.0.0"
      PROXORA_INSTALL_DIR: ${PROXORA_INSTALL_DIR:-/opt/proxora}
      PROXORA_REPO: ${PROXORA_REPO:-MarcelRuh/proxora}
      PROXORA_BRANCH: ${PROXORA_BRANCH:-main}
      PROXORA_UPDATE_SIGNAL_DIR: /update-signal
      WG_CONFIG_DIR: /wireguard
    volumes:
      - proxora_update_signal:/update-signal
      - proxora_wireguard:/wireguard
    cap_add:
      - NET_ADMIN
    device_cgroup_rules:
      - "c 10:200 rwm"
    depends_on:
      postgres:
        condition: service_healthy

  proxora-wireguard:
    build:
      context: .
      dockerfile: docker/wireguard/Dockerfile
    container_name: proxora-wireguard
    restart: unless-stopped
    network_mode: "service:proxora"
    cap_add:
      - NET_ADMIN
    device_cgroup_rules:
      - "c 10:200 rwm"
    volumes:
      - proxora_wireguard:/wireguard
    depends_on:
      - proxora

  proxora-updater:
    image: docker:27.5.1-cli
    container_name: proxora-updater
    restart: unless-stopped
    environment:
      COMPOSE_BAKE: "false"
      PROXORA_INSTALL_DIR: ${PROXORA_INSTALL_DIR:-/opt/proxora}
      PROXORA_REPO: ${PROXORA_REPO:-MarcelRuh/proxora}
      PROXORA_BRANCH: ${PROXORA_BRANCH:-main}
      PROXORA_UPDATE_SIGNAL_DIR: /update-signal
      PROXORA_SIGNAL_VOLUME: proxora_update_signal
      PROXORA_DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME:-proxora}_default
      PROXORA_UPDATER_IMAGE: docker:27.5.1-cli
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GH_TOKEN: ${GH_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PROXORA_INSTALL_DIR:-/opt/proxora}:${PROXORA_INSTALL_DIR:-/opt/proxora}
      - ${PROXORA_INSTALL_DIR:-/opt/proxora}/scripts/update-watcher.sh:/update-watcher.sh:ro
      - proxora_update_signal:/update-signal
    entrypoint: ["sh", "/update-watcher.sh"]
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  proxora_update_signal:
    name: proxora_update_signal
  proxora_wireguard:
    name: proxora_wireguard
