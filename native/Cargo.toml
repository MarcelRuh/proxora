[package]
name = "proxora-native"
version = "0.3.0"
edition = "2021"
description = "Native Rust desktop client for Proxora (API-first; eventual web UI replacement)"
license = "MIT"
repository = "https://github.com/MarcelRuh/proxora"
publish = false

[lib]
name = "proxora_core"
path = "src/lib.rs"

[[bin]]
name = "proxora-native"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.31"
egui_extras = { version = "0.31", features = ["image"] }
egui-phosphor = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "json", "rustls-tls", "multipart"] }
url = "2"
directories = "6"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rfd = "0.15"
open = "5"
base64 = "0.22"
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
vt100 = "0.18"
getrandom = "0.3"

[build-dependencies]
winresource = "0.1"

[features]
demo = []

[[example]]
name = "snapshot"
required-features = ["demo"]

[profile.release]
lto = true
codegen-units = 1
strip = true
