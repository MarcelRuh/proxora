name: Native Client

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "native-v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        working-directory: native
        run: cargo build --release
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Package installer and portable zip
        shell: pwsh
        run: |
          $ver = (Select-String -Path native/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $exe = Resolve-Path native/target/release/proxora-native.exe
          New-Item -ItemType Directory -Force -Path native/dist | Out-Null
          Copy-Item $exe native/dist/proxora-native.exe -Force
          Compress-Archive -Path native/dist/proxora-native.exe -DestinationPath "native/dist/ProxoraNative_${ver}_x64-portable.zip" -Force
          $out = Resolve-Path native/dist
          $nsi = Resolve-Path native/packaging/proxora-native.nsi
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { $makensis = "$env:ProgramFiles\NSIS\makensis.exe" }
          & $makensis `
            "/DAPP_VERSION=$ver" `
            "/DSOURCE_EXE=$($exe.Path)" `
            "/XOutFile $out\ProxoraNative_${ver}_x64-setup.exe" `
            $nsi.Path
          Get-ChildItem native/dist | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: proxora-native-windows
          path: |
            native/dist/ProxoraNative_*_x64-setup.exe
            native/dist/ProxoraNative_*_x64-portable.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GUI deps
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev pkg-config
      - name: Build release binary
        working-directory: native
        run: cargo build --release
      - name: Package tarball
        run: |
          ver="$(python3 -c 'import tomllib; print(tomllib.load(open("native/Cargo.toml","rb"))["package"]["version"])')"
          mkdir -p native/dist
          cp native/target/release/proxora-native "native/dist/proxora-native"
          tar -C native/dist -czf "native/dist/ProxoraNative_${ver}_linux_amd64.tar.gz" proxora-native
      - uses: actions/upload-artifact@v4
        with:
          name: proxora-native-linux
          path: native/dist/ProxoraNative_*_linux_amd64.tar.gz

  release-upload:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Upload assets to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --title "$tag" --notes "Proxora Native client packages"
          fi
          mapfile -t files < <(find artifacts -type f | sort)
          gh release upload "$tag" "${files[@]}" --clobber
          printf 'Uploaded %s files to %s\n' "${#files[@]}" "$tag"
