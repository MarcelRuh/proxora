services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: proxora
      POSTGRES_PASSWORD: proxora
      POSTGRES_DB: proxora
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proxora -d proxora"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-proxora}"]
    ports:
      - "6379:6379"

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    environment:
      POST: 1
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      BUILD: 1
      SYSTEM: 1
      INFO: 1
      SESSION: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
      EXEC: 0
      AUTH: 0
      SECRETS: 0
      SWARM: 0
      PLUGINS: 0
      COMMIT: 0
      CONFIGS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true

  proxora:
    build: .
    container_name: proxora
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://proxora:proxora@postgres:5432/proxora?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-proxora}@redis:6379
      APP_URL: http://localhost:3000
      PORT: "3000"
      LISTEN_HOST: "0.0.0.0"
      PROXORA_INSTALL_DIR: ${PROXORA_INSTALL_DIR:-/opt/proxora}
      PROXORA_REPO: ${PROXORA_REPO:-MarcelRuh/proxora}
      PROXORA_BRANCH: ${PROXORA_BRANCH:-main}
      PROXORA_UPDATE_SIGNAL_DIR: /update-signal
    volumes:
      - proxora_update_signal:/update-signal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  proxora-updater:
    image: docker:27.5.1-cli
    container_name: proxora-updater
    restart: unless-stopped
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      PROXORA_INSTALL_DIR: ${PROXORA_INSTALL_DIR:-/opt/proxora}
      PROXORA_REPO: ${PROXORA_REPO:-MarcelRuh/proxora}
      PROXORA_BRANCH: ${PROXORA_BRANCH:-main}
      PROXORA_UPDATE_SIGNAL_DIR: /update-signal
      PROXORA_SIGNAL_VOLUME: proxora_update_signal
      PROXORA_DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME:-proxora}_default
      PROXORA_UPDATER_IMAGE: docker:27.5.1-cli
    volumes:
      - ${PROXORA_INSTALL_DIR:-/opt/proxora}:${PROXORA_INSTALL_DIR:-/opt/proxora}
      - ${PROXORA_INSTALL_DIR:-/opt/proxora}/scripts/update-watcher.sh:/update-watcher.sh:ro
      - proxora_update_signal:/update-signal
    entrypoint: ["sh", "/update-watcher.sh"]
    depends_on:
      - docker-socket-proxy
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  proxora_update_signal:
    name: proxora_update_signal
