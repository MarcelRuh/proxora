services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: proxora
      POSTGRES_PASSWORD: proxora
      POSTGRES_DB: proxora
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proxora -d proxora"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  proxora:
    build: .
    container_name: proxora
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://proxora:proxora@postgres:5432/proxora?schema=public
      REDIS_URL: redis://redis:6379
      APP_URL: http://localhost:3000
      PORT: "3000"
      LISTEN_HOST: "0.0.0.0"
      PROXORA_INSTALL_DIR: ${PROXORA_INSTALL_DIR:-/opt/proxora}
      PROXORA_INSTALL_MOUNT: /install
      PROXORA_REPO: ${PROXORA_REPO:-MarcelRuh/proxora}
      PROXORA_BRANCH: ${PROXORA_BRANCH:-main}
    volumes:
      - ${PROXORA_INSTALL_DIR:-.}:/install
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
