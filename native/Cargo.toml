[package]
name = "proxora-native"
version = "0.1.0"
edition = "2021"
description = "Native Rust desktop client for Proxora (API-first; eventual web UI replacement)"
license = "MIT"
repository = "https://github.com/MarcelRuh/proxora"
publish = false

[dependencies]
eframe = { version = "0.31", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "json", "rustls-tls"] }
url = "2"
directories = "6"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
