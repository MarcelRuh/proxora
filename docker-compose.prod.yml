services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-proxora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proxora}
      POSTGRES_DB: ${POSTGRES_DB:-proxora}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proxora} -d ${POSTGRES_DB:-proxora}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-proxora}"]

  proxora:
    build: .
    container_name: proxora
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      LISTEN_HOST: "0.0.0.0"
      DATABASE_URL: postgresql://${POSTGRES_USER:-proxora}:${POSTGRES_PASSWORD:-proxora}@postgres:5432/${POSTGRES_DB:-proxora}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-proxora}@redis:6379
      APP_URL: ${APP_URL:-http://localhost:3000}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@localhost}
      PROXORA_INSTALL_DIR: ${PROXORA_INSTALL_DIR:-/opt/proxora}
      PROXORA_REPO: ${PROXORA_REPO:-MarcelRuh/proxora}
      PROXORA_BRANCH: ${PROXORA_BRANCH:-main}
      PROXORA_UPDATE_SIGNAL_DIR: /update-signal
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - proxora_update_signal:/update-signal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  proxora-updater:
    image: docker:27.5.1-cli
    container_name: proxora-updater
    restart: unless-stopped
    environment:
      COMPOSE_BAKE: "false"
      PROXORA_INSTALL_DIR: ${PROXORA_INSTALL_DIR:-/opt/proxora}
      PROXORA_REPO: ${PROXORA_REPO:-MarcelRuh/proxora}
      PROXORA_BRANCH: ${PROXORA_BRANCH:-main}
      PROXORA_UPDATE_SIGNAL_DIR: /update-signal
      PROXORA_SIGNAL_VOLUME: proxora_update_signal
      PROXORA_DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME:-proxora}_default
      PROXORA_UPDATER_IMAGE: docker:27.5.1-cli
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GH_TOKEN: ${GH_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PROXORA_INSTALL_DIR:-/opt/proxora}:${PROXORA_INSTALL_DIR:-/opt/proxora}
      - ${PROXORA_INSTALL_DIR:-/opt/proxora}/scripts/update-watcher.sh:/update-watcher.sh:ro
      - proxora_update_signal:/update-signal
    entrypoint: ["sh", "/update-watcher.sh"]
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  proxora_update_signal:
    name: proxora_update_signal
